plugins {
    id "dev.architectury.loom" version "1.7.416" apply false
}

subprojects {
    apply plugin: "java"
    apply plugin: "dev.architectury.loom"

    group = rootProject.maven_group
    version = rootProject.mod_version

    base {
        archivesName = rootProject.archives_base_name
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    repositories {
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven {
            url = "https://maven.neoforged.net/releases/"
            content {
                includeGroup "net.neoforged"
                includeGroup "net.neoforged.fancymodloader"
            }
        }
        mavenCentral()
    }

    // Every loader compiles the shared sources straight out of common/.
    sourceSets {
        main {
            java.srcDir rootProject.file(rootProject.shared_src)
            resources.srcDir rootProject.file(rootProject.shared_res)
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }

        // MCEF ships a dedicated API jar for modders; the full mod provides the implementation at
        // runtime. Build it with: cd ../mcef && gradle :fabric:apiJar
        compileOnly files(rootProject.file("libs/mcef-api.jar"))
    }

    processResources {
        inputs.property "version", project.version
        filesMatching(["fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml"]) {
            expand "version": project.version,
                    "minecraft_version": rootProject.minecraft_version,
                    "mcef_version": rootProject.mcef_version,
                    "fabric_loader_version": rootProject.fabric_loader_version,
                    "forge_version": rootProject.forge_version,
                    "neoforge_version": rootProject.neoforge_version
        }
    }
}
