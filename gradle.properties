# ------------------------------------------------------------------
# WebDisplays 1.20.1 multi-loader build properties
# ------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / mod
minecraft_version=1.20.1
mod_version=1.20.1-1.1
maven_group=net.montoyo
archives_base_name=webdisplays

# Mappings
parchment_version=2023.09.03

# Platforms
fabric_loader_version=0.16.14
fabric_api_version=0.92.5+1.20.1
forge_version=1.20.1-47.2.0
neoforge_version=1.20.1-47.1.106

# MCEF (built separately from ../mcef, only the api package is needed at compile time)
mcef_version=1.20.1-1.20

# Shared source directory (not a Gradle project, added to every loader source set)
shared_src=common/src/main/java
shared_res=common/src/main/resources
